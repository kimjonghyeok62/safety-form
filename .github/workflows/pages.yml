name: 옛 주소 안내 (GitHub Pages → Vercel)

# 웹판은 Vercel(https://safety-form.vercel.app)로 옮겼다. vercel.json 참고.
# 옛 주소(kimjonghyeok62.github.io/safety-form)로 들어오면 새 주소로 넘겨 준다.
# 브라우저에 저장된 내용은 주소마다 따로라, 옛 주소에서 쓰던 분은 [저장 · 이어쓰기]로 옮겨야 한다.

on:
  push:
    branches: [main]
    paths: [".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 넘겨 주는 쪽 만들기
        run: |
          mkdir -p out
          cat > out/index.html <<'EOF'
          <!doctype html>
          <html lang="ko"><head><meta charset="utf-8" />
          <meta name="viewport" content="width=device-width, initial-scale=1" />
          <meta http-equiv="refresh" content="0; url=https://safety-form.vercel.app/" />
          <link rel="canonical" href="https://safety-form.vercel.app/" />
          <title>중대재해 예방 서식 자동화 — 주소가 바뀌었습니다</title></head>
          <body style="font-family:'Malgun Gothic',sans-serif;padding:40px;font-size:18px;line-height:1.6">
          <p>주소가 바뀌었습니다. 잠시 뒤 새 주소로 넘어갑니다.</p>
          <p><a href="https://safety-form.vercel.app/">https://safety-form.vercel.app/</a></p>
          </body></html>
          EOF
          cp out/index.html out/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
