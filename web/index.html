<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- 밖으로 나가는 요청은 글꼴(jsdelivr)과, 구글 계정으로 이어쓰기를 켰을 때의 구글 주소뿐이다. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://accounts.google.com/gsi/style; font-src 'self' https://cdn.jsdelivr.net; script-src 'self' https://accounts.google.com/gsi/client; connect-src 'self' https://www.googleapis.com https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; object-src 'none'; base-uri 'self'" />
  <meta name="theme-color" content="#1b2b4b" />
  <title>중대재해 예방 서식 자동화</title>
  <meta name="description" content="계약 정보를 한 번 넣으면 중대재해처벌법 관련 한글(hwpx) 서식이 내용이 채워진 채로 만들어집니다. 입력한 정보는 서버로 가지 않습니다." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%231b2b4b'/%3E%3Cpath d='M12 4l6 2.5v4.5c0 3.6-2.5 6.6-6 7.8-3.5-1.2-6-4.2-6-7.8V6.5z' fill='none' stroke='white' stroke-width='1.8'/%3E%3Cpath d='m9.3 11.6 1.9 1.9 3.6-3.6' fill='none' stroke='white' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" crossorigin=""
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-brand">
      <span class="topbar-logo" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2.5 20 6v5.5c0 4.6-3.3 8.6-8 10-4.7-1.4-8-5.4-8-10V6z" />
          <path d="m8.5 12 2.5 2.5 4.5-4.5" />
        </svg>
      </span>
      <span class="topbar-title"><span class="hide-sm">중대재해 예방 </span>서식 자동화</span>
    </div>
    <div class="topbar-actions">
      <button id="syncChip" class="topbar-btn" type="button"></button>
    </div>
  </header>

  <nav id="topnav" class="topnav" aria-label="메뉴"></nav>

  <div class="shell-body">
    <nav id="sidenav" class="sidenav" aria-label="메뉴"></nav>
    <main id="view" class="page"></main>
  </div>

  <dialog id="dlg" class="dlg"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
